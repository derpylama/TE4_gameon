<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/images/tiles/bee.png">
    <title>WeCopyBaba</title>
    <link rel="stylesheet" href="./css/style.css">

    <!-- JS IMPORTS -->
    <script src="./js/classes/grid.js"></script>
    <script src="./js/classes/object.js"></script>
    <script src="./js/classes/codeblocks.js"></script>
    <script src="./js/classes/codeinterpreter.js"></script>
    <script src="./js/level_helpers.js"></script>
    <script src="./js/logic.js"></script>
    <script src="./js/render.js"></script>
    <script src="./js/audio.js"></script>
    <script src="./js/overlays.js"></script>
    <script src="./js/levels.js"></script>

    <script src="./js/levels/test.js"></script>
    <script src="./js/levels/level1.js"></script>
    <script src="./js/levels/level2.js"></script>

    <script src="./js/ui.js"></script>
    <script src="./js/game.js" defer></script>



    <script src="./js/frontend.js" defer></script>

</head>
<body>
    <!-- Each texture pixel is 5 screenpixels, we add four txPx around canvas, i.e + 2*(4*5) -->
    <!-- Non offset size is: 1280x800 -->
    <main>
        <canvas id="canvas" width="1320" height="840"></canvas>
        <aside>
            <h2>Your goal is to get back to the beehive,<br>use codeblocks to bend reality to your advantage.</h2>
            <img src="./assets/images/controls.png" alt="Controls" id="controlsUiImage">
        </aside>
    </main>
    <footer>
        <i>Made by toalettpojkarna (Te4)</i>
        <!-- Known issue: pressing pause before audio is declared then later resuming it fails to play until paused/played again -->
        <div id="audioPauseBtn">
            <img src="./assets/images/icons/unmute.png" alt="Audio Toggle" id="audioIcon-paused" style="display: none;">
            <img src="./assets/images/icons/mute.png" alt="Audio Toggle" id="audioIcon-playing">
        </div>
        <input type="range" id="volumeSlider" min="0" max="100" step="1" value="50">
</body>
</html>
